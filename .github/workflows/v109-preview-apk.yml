name: Tabibi V109 preview APK
on:
  push:
    branches: [v109-ui-redesign]
  workflow_dispatch:
jobs:
  android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Expo config check
        run: npx expo config --type public
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_DEMO_MODE: '1'
      - name: Align Kotlin compiler across generated and Expo Gradle files
        run: |
          sed -i 's/1.9.24/1.9.25/g' android/build.gradle android/settings.gradle android/gradle.properties 2>/dev/null || true
          # Expo Modules Core can declare its own Kotlin plugin version under node_modules.
          grep -RIl --include='*.gradle' --include='*.gradle.kts' '1.9.24' node_modules/expo-modules-core node_modules/expo-modules-autolinking 2>/dev/null | while read file; do
            sed -i 's/1.9.24/1.9.25/g' "$file"
          done
          echo '--- Remaining Kotlin 1.9.24 declarations in relevant Gradle files ---'
          grep -RIn --include='*.gradle' --include='*.gradle.kts' '1.9.24' android node_modules/expo-modules-core node_modules/expo-modules-autolinking 2>/dev/null || true
          echo '--- Selected Kotlin version ---'
          grep -nE 'kotlinVersion|android.kotlinVersion' android/build.gradle android/gradle.properties || true
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          EXPO_PUBLIC_DEMO_MODE=1 ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tabibi-v109-preview-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
