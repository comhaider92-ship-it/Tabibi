name: Tabibi build verification
# Rebuild Android demo after aligning Expo SDK 52 native modules

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Build backend
        run: npm run build
      - name: Check database migration readiness
        run: npm run check:migrations
      - name: Run retained V100-V108 regression checks
        run: |
          for version in 100 101 102 103 104 105 106 107 108; do
            python scripts_verify_v${version}.py
          done

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check mobile app
        run: npm run typecheck
      - name: Validate Expo app configuration
        run: npx expo config --type public

  package:
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate reviewed npm lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd mobile
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ..
      - name: Verify clean installs from lockfiles
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cd mobile
          npm ci --no-audit --no-fund
          npm run typecheck
          npx expo config --type public
          cd ..
      - name: Commit reproducible dependency lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add verified npm lockfiles"
            git push origin HEAD:main
          fi
      - name: Create complete source archive
        run: |
          rm -f TABIBI_v109_FIXED.zip
          find . -type f \
            ! -path './.git/*' \
            ! -path '*/node_modules/*' \
            ! -path './mobile/.expo/*' \
            ! -path './dist/*' \
            ! -path './mobile/dist/*' \
            ! -path './build/*' \
            ! -name '*.zip' \
            ! -name '.env' \
            -print0 | xargs -0 zip -q TABIBI_v109_FIXED.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tabibi-v109-fixed
          path: TABIBI_v109_FIXED.zip
          if-no-files-found: error
          retention-days: 30

  android-demo:
    needs: [mobile, package]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Android project for offline demo
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_DEMO_MODE: '1'
      - name: Align Kotlin with Compose compiler
        run: |
          if grep -q '^android.kotlinVersion=' android/gradle.properties; then
            sed -i 's/^android.kotlinVersion=.*/android.kotlinVersion=1.9.25/' android/gradle.properties
          else
            echo 'android.kotlinVersion=1.9.25' >> android/gradle.properties
          fi
      - name: Build installable Android APK
        run: |
          chmod +x android/gradlew
          cd android
          EXPO_PUBLIC_DEMO_MODE=1 ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tabibi-demo-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
