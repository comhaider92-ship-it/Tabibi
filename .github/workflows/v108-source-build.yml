name: V108 Source Build Check

on:
  push:
    branches:
      - audit/v108-source-review
    paths:
      - '.github/workflows/v108-source-build.yml'
      - 'src/**'
      - 'mobile/src/**'
      - package.json
      - mobile/package.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --ignore-scripts
      - name: Audit backend and mobile dependencies
        shell: bash
        run: |
          npm audit --json > backend-audit.json || true
          npm audit --omit=dev --json > backend-prod-audit.json || true
          (cd mobile && npm audit --json > ../mobile-audit.json) || true
          (cd mobile && npm audit --omit=dev --json > ../mobile-prod-audit.json) || true
          node -e 'const fs=require("fs"); for (const file of ["backend-audit.json","backend-prod-audit.json","mobile-audit.json","mobile-prod-audit.json"]) { const a=JSON.parse(fs.readFileSync(file,"utf8")); const v=a.metadata?.vulnerabilities ?? {}; console.log(file + ": " + JSON.stringify(v)); if (!file.includes("prod")) for (const [name,item] of Object.entries(a.vulnerabilities ?? {})) if (["high","critical"].includes(item.severity)) console.log(name + " | " + item.severity + " | range=" + item.range + " | fix=" + JSON.stringify(item.fixAvailable)); }'
      - name: Save dependency lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add dependency lockfiles for reproducible builds"
            git push origin HEAD:audit/v108-source-review
          fi
      - name: Compile NestJS backend
        run: npm run build
      - name: Type-check mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Run repository readiness checks
        run: |
          npm run check:build-readiness
          npm run check:migrations
      - name: Confirm test configuration
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test?0:1)"; then
            CI=true npm test -- --runInBand
          else
            echo "No test script is declared in V108."
          fi

      - name: Package V109 development candidate
        shell: bash
        run: |
          git archive --format=zip --prefix=TABIBI_v109/ --output=TABIBI_v109.zip HEAD -- . ':(exclude)TABIBI_v109.zip'
          unzip -t TABIBI_v109.zip
          test -s TABIBI_v109.zip
          unzip -Z1 TABIBI_v109.zip | grep -q '^TABIBI_v109/src/uploads/upload-asset.entity.ts
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package TABIBI V109 development candidate"
          git push origin HEAD:audit/v108-source-review
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabibi-v108-dependency-audit
          path: |
            backend-audit.json
            mobile-audit.json
            backend-prod-audit.json
            mobile-prod-audit.json
            TABIBI_v109.zip
            V109_CHANGELOG.md
          if-no-files-found: warn

          echo "V109 archive file count: $(unzip -Z1 TABIBI_v109.zip | wc -l)"
          sha256sum TABIBI_v109.zip
          git add -f TABIBI_v109.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package TABIBI V109 development candidate"
          git push origin HEAD:audit/v108-source-review
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabibi-v108-dependency-audit
          path: |
            backend-audit.json
            mobile-audit.json
            backend-prod-audit.json
            mobile-prod-audit.json
            TABIBI_v109.zip
            V109_CHANGELOG.md
          if-no-files-found: warn
