name: TABIBI V113 source archive
on:
  push:
    branches:
      - v113-security-patch
    paths:
      - '.github/workflows/v113-source-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v113-security-patch
      - name: Create complete source ZIP
        run: git archive --format=zip --prefix=TABIBI_v113/ HEAD -o TABIBI_v113.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TABIBI_v113_source
          path: TABIBI_v113.zip
          if-no-files-found: error
          retention-days: 30
