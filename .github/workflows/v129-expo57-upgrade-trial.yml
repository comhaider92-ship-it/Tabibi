name: TABIBI V129 Expo SDK 57 migration trial
on:
  push:
    branches:
      - v129-expo57-upgrade-trial
    paths:
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'mobile/app.json'
      - 'mobile/src/**'
      - 'mobile/scripts/**'
      - '.github/workflows/v129-expo57-upgrade-trial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expo55:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v129-expo57-upgrade-trial
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install Expo SDK 57 base
        working-directory: mobile
        run: npm install expo@~57.0.0 --ignore-scripts --no-audit --no-fund
      - name: Align native dependencies to Expo SDK 57
        working-directory: mobile
        run: npx expo install --fix
      - name: Reconcile and install locked mobile dependencies
        working-directory: mobile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply Metro image-size compatibility patch
        working-directory: mobile
        run: node scripts/patch-metro-image-size.mjs
      - name: Verify Expo dependency compatibility
        working-directory: mobile
        run: npx expo-doctor
      - name: Mobile TypeScript check
        working-directory: mobile
        run: npm run typecheck
      - name: Export Android JavaScript bundle
        working-directory: mobile
        env:
          EXPO_DEBUG: '1'
        run: npx expo export --platform android
      - name: Check backend readiness
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run check:migrations
          npm run check:build-readiness
      - name: Capture mobile dependency audit
        if: always()
        working-directory: mobile
        run: npm audit --json > ../mobile-audit-v129.json || true
      - name: Commit tested Expo SDK 57 lockfiles
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "Upgrade mobile app to Expo SDK 57"
          git push origin HEAD:v129-expo57-upgrade-trial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabibi-v129-expo57-evidence
          path: mobile-audit-v129.json
          if-no-files-found: warn
          retention-days: 30
