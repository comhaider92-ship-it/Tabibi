name: TABIBI V129 Android test APK

on:
  push:
    branches:
      - v129-deployment-readiness-trial
    paths:
      - 'mobile/**'
      - '.github/workflows/v129-android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout V129 candidate
        uses: actions/checkout@v4
        with:
          ref: v129-deployment-readiness-trial

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Generate native Android project
        env:
          EXPO_PUBLIC_API_URL: https://tabibi-ci.invalid/api/v1
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TABIBI_V129_ANDROID_TEST_APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
