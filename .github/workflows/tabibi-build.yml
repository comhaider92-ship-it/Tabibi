name: Tabibi build verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Build backend
        run: npm run build
      - name: Check database migration readiness
        run: npm run check:migrations
      - name: Run retained V100-V108 regression checks
        run: |
          for version in 100 101 102 103 104 105 106 107 108; do
            python scripts_verify_v${version}.py
          done

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check mobile app
        run: npm run typecheck
      - name: Validate Expo app configuration
        run: npx expo config --type public
