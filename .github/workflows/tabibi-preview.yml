name: Publish Tabibi preview
on:
  push:
    branches: [tabibi-home-improvements-2026-11]
    paths: ['docs/preview/**','.github/workflows/tabibi-preview.yml']
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/preview
      - id: deployment
        uses: actions/deploy-pages@v4
