name: TABIBI V120 source archive
on:
  push:
    branches:
      - v120-security-patch
    paths:
      - '.github/workflows/v120-source-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v120-security-patch
      - name: Create complete source ZIP
        run: git archive --format=zip --prefix=TABIBI_v120/ HEAD -o TABIBI_v120.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TABIBI_v120_source
          path: TABIBI_v120.zip
          if-no-files-found: error
          retention-days: 30
